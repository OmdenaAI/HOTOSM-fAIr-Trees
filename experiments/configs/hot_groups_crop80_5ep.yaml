# hot_groups_crop80.yaml at 5 epochs instead of 10, the one change: its val tree F1 was flat after the first
# epochs (best at epoch 4), so half the schedule may score the same in half the time. The seed is the same,
# so the epochs draw the same samples as its first five and only the cosine schedule (now over 5 epochs)
# differs. Patience 5 trains the whole schedule. This run is also the control for later 5-epoch runs.
weights: runs/joint-base-wise-0.3/weights.pt  # relative to the Drive root
sources: [hot]
hyperparameters:
  num_classes: 2
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 5
  patience: 5
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
  ckpt_every_min: 60
  keep_last: 5
  augment:
    crop_m: [30, 80]
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the tree window hot_platform.yaml and its weight blends were scored at
  group_window_m: 120
mlflow: true
