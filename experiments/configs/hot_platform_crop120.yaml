# hot_platform.yaml with crops up to 120 m: the tree-only control for hot_groups.yaml, which needs those
# crops for its groups. Run it only if hot_groups.yaml moves tree F1, to tell the crops from the class.
weights: weights/NEON.pt          # relative to the Drive root
sources: [hot]
hyperparameters:
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 3
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
  augment:
    crop_m: [30, 120]
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the window hot_platform.yaml and its weight blends were scored at
mlflow: true
