# hot_groups_crop80.yaml on shards/hot-relabeled instead of shards/hot, the one change: every HOT tree outside
# a group takes its hand-drawn crown box (train and val), cant_tell and merged trees are ignore squares and
# not_a_tree points get nothing. Groups, regions and masks are as in shards/hot. Val picks the epoch and
# thresholds on the drawn val boxes; score against HOT's own labels with the crop80 config and these weights.
weights: runs/joint-base-wise-0.3/weights.pt  # relative to the Drive root
sources: [hot-relabeled]
hyperparameters:
  num_classes: 2
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 10
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
  ckpt_every_min: 60
  keep_last: 10
  augment:
    crop_m: [30, 80]
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the tree window hot_platform.yaml and its weight blends were scored at
  group_window_m: 120
mlflow: true
