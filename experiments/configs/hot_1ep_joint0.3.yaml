# hot_1ep_lr1e-3.yaml started from the 0.3 blend of the release weights and the joint NEON + OAM-TCD base
# (NEON 0.638, OAM-TCD test 0.505) instead of the release weights. Blends of this run mix it with that base.
weights: runs/joint-base-wise-0.3/weights.pt  # relative to the Drive root
sources: [hot]
hyperparameters:
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 1
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the window hot_platform.yaml and its weight blends were scored at
mlflow: true
