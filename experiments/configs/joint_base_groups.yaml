# joint_base.yaml with a second class: OAM-TCD canopy converted as tree_group labels (canopy_as_groups),
# so the base learns groups from tiles worldwide before any HOT training. NEON labels trees only, so it
# never teaches "no group here". Early stopping averages NEON trees, OAM-TCD trees and OAM-TCD groups.
weights: weights/NEON.pt          # relative to the Drive root
sources: [neon, oamtcd]
hyperparameters:
  num_classes: 2
  trainable_layers: 3
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 3
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: 20000
  schedule: cosine
  source_alpha: 0.0               # equal draws per source
  augment:
    crop_m: [30, 120]
  amp: true
  seed: 42
val:
  zooms: [20, 19]
  max_regions: {oamtcd: 100}
  window_m: 40
  group_window_m: 120
mlflow: true
