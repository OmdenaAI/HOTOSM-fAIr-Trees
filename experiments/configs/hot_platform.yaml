# The platform fine-tune on HOT train, with early stopping on HOT val.
weights: weights/NEON.pt          # relative to the Drive root
sources: [hot]
hyperparameters:
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 3
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # 60 m windows scored best on HOT val (40 m is the default)
mlflow: true
