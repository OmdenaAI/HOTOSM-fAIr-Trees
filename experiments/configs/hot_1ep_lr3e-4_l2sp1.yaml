# hot_1ep_lr3e-4_l2sp0.1.yaml with a 10x stronger pull toward the release weights.
weights: weights/NEON.pt          # relative to the Drive root
sources: [hot]
hyperparameters:
  trainable_layers: 0
  learning_rate: 0.0003
  momentum: 0.9
  weight_decay: 0.0001            # set to 0 by the parser: L2-SP replaces weight decay
  l2sp_alpha: 1.0
  epochs: 1
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the window hot_platform.yaml and its weight blends were scored at
mlflow: true
