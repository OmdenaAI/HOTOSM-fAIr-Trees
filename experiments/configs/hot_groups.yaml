# hot_platform.yaml with a second class: one box per tree and one per tree_group, from the release weights
# (their tree head is kept and a group head is added). Crops reach 120 m so whole groups fit, as at the
# 120 m group window; hot_platform_crop120.yaml is the tree-only control with the same crops.
weights: weights/NEON.pt          # relative to the Drive root
sources: [hot]
hyperparameters:
  num_classes: 2
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 3
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
  augment:
    crop_m: [30, 120]
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the tree window hot_platform.yaml and its weight blends were scored at
  group_window_m: 120
mlflow: true
