# hot_platform.yaml starting from the joint NEON + OAM-TCD base instead of the release weights. Weight
# blends of this run (the colab_train blend cell) mix it with that base, the `weights` below.
weights: runs/joint-base/best.pt  # relative to the Drive root
sources: [hot]
hyperparameters:
  trainable_layers: 0
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  l2sp_alpha: 0.0
  epochs: 10
  patience: 3
  min_delta: 0.005
  batch_size: 4
  samples_per_epoch: null         # one epoch = the number of train chips, as on the platform
  schedule: cosine
  amp: true
  seed: 42
val:
  zooms: [20, 19]
  max_regions: null
  window_m: 60                    # the window hot_platform.yaml and its weight blends were scored at
mlflow: true
